name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check release version
        run: node -e 'const v=require("./package.json").version;if(process.env.GITHUB_REF_NAME!==`v${v}`)throw Error(`Expected tag v${v}, received ${process.env.GITHUB_REF_NAME}`)'
      - run: node scripts/verify.mjs
      - run: node test/run.mjs
      - run: node scripts/build.mjs
      - run: node test/native-smoke.mjs
      - run: npm install --global opencode-ai@1.18.25 --no-audit --no-fund
      - run: node test/opencode-smoke.mjs
      - run: node scripts/package.mjs --native
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/**/*.zip
            dist/**/*.sha256
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Publish macOS preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t files < <(find assets -type f \( -name '*.zip' -o -name '*.sha256' \))
          test "${#files[@]}" -eq 4
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --prerelease --title "$GITHUB_REF_NAME macOS preview" --notes 'Native macOS build for Apple Silicon and Intel. Source, tests and agent setup instructions are included. Accessibility, Screen Recording and Input Monitoring require human approval. Compilation and native protocol checks run on both architectures; real desktop interaction still needs validation on a user Mac. These bundles are ad-hoc signed, not notarized.'
          fi
